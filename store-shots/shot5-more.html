<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="shared.css">
<style>
  .shot-head { padding-top: 56px; }
  .shot-head h1 { font-size: 38px; }
  .bento-grid { margin-top: 40px; }
  .bento-demo { height: 132px; }
  .md-plus .menu { top: 68px; }
</style>
</head>
<body>

<header class="shot-head">
  <p class="eyebrow">More · 还有这些</p>
  <h1>顺手小功能，一个都不少。</h1>
</header>

<div class="bento-grid">
  <article class="bento-card">
    <p class="bento-tag">META</p>
    <h3 class="bento-title">标题作者与时间</h3>
    <p class="bento-text">标题下面直接显示创建人和最后编辑时间，不用点开详情页。</p>
    <div class="bento-demo">
      <div class="md-meta">
        <div class="t"></div>
        <div class="row"><span class="a">张</span><span>张三 创建于 9月12日 · 最后编辑 10:24</span></div>
        <div class="lines"><i style="width:92%"></i><i style="width:78%"></i></div>
      </div>
    </div>
  </article>

  <article class="bento-card">
    <p class="bento-tag">LAYOUT</p>
    <h3 class="bento-title">默认 Web 版式</h3>
    <p class="bento-text">打开文档自动切到 Web 版式，正文铺满不分页。</p>
    <div class="bento-demo">
      <div class="md-web">
        <div class="caps"><span class="cap">分页</span><span class="cap on">WEB 版式</span></div>
        <div class="stage">
          <div class="full"><i style="width:96%"></i><i style="width:88%"></i><i style="width:93%"></i><i style="width:64%"></i></div>
        </div>
      </div>
    </div>
  </article>

  <article class="bento-card">
    <p class="bento-tag">CREATE</p>
    <h3 class="bento-title">快速创建文档</h3>
    <p class="bento-text">顶栏加号按钮，一键新建智能文档。</p>
    <div class="bento-demo">
      <div class="md-plus">
        <div class="bar">
          <img class="logo" src="assets/smartdoc-fill-24.svg" alt="">
          <span class="pill"></span>
          <span class="plusbtn">
            <svg viewBox="0 0 14 14"><path d="M7 3v8M3 7h8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </span>
        </div>
        <div class="menu">
          <div class="mi">
            <svg viewBox="0 0 14 14"><path d="M3.5 1.8h4.6l2.4 2.4v8H3.5z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M8 1.8v2.5h2.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
            新建智能文档
          </div>
        </div>
      </div>
    </div>
  </article>

  <article class="bento-card">
    <p class="bento-tag">PRIVACY</p>
    <h3 class="bento-title">本地运行，零上传</h3>
    <p class="bento-text">所有功能都在你的浏览器里完成。不采集、不上传、不联网。</p>
    <div class="bento-demo">
      <div class="md-privacy">
        <svg class="lock" viewBox="0 0 18 18"><rect x="3.5" y="8" width="11" height="7" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6 8V5.8a3 3 0 0 1 6 0V8" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="9" cy="11.5" r="1.1" fill="currentColor"/></svg>
        <div class="stats">
          <div class="srow"><span class="k">COLLECT</span><span class="v">0</span></div>
          <div class="srow"><span class="k">UPLOAD</span><span class="v">0</span></div>
          <div class="srow"><span class="k">NETWORK</span><span class="v">OFF</span></div>
        </div>
      </div>
    </div>
  </article>
</div>

</body>
</html>
