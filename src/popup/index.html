<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WecomBetter 企微搭子</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header class="mast">
      <img class="mast-mark" src="../../icons/icon48.png" width="28" height="28" alt="" />
      <div class="mast-copy">
        <div class="mast-row">
          <h1>WecomBetter 企微搭子</h1>
          <span class="ver">1.0.4</span>
        </div>
      </div>
    </header>

    <section class="sheet" aria-label="功能开关">
      <label class="row">
        <span class="glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M16.31 15.561l4.114 4.115-.848.848-4.123-4.123a7 7 0 11.857-.84zM16.8 11a5.8 5.8 0 10-11.6 0 5.8 5.8 0 0011.6 0z"
              fill="#267EF0"
              fill-rule="evenodd"
            />
          </svg>
        </span>
        <span class="meta">
          <span class="title">顶栏快捷搜索</span>
          <span class="desc">智能文档 / 文档顶栏搜索，点击出建议列表</span>
        </span>
        <input id="toggle-search" type="checkbox" role="switch" checked />
        <span class="track" aria-hidden="true"></span>
      </label>

      <label class="row">
        <span class="glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M18.75 11C19.9926 11 21 12.0074 21 13.25V15H21.75C22.9926 15 24 16.0074 24 17.25V19.75C24 20.9926 22.9926 22 21.75 22H19.25C18.0074 22 17 20.9926 17 19.75V17.25C17 16.0074 18.0074 15 19.25 15H19.5V13.25C19.5 12.8358 19.1642 12.5 18.75 12.5H5.25C4.83579 12.5 4.5 12.8358 4.5 13.25V15H4.75C5.99264 15 7 16.0074 7 17.25V19.75C7 20.9926 5.99264 22 4.75 22H2.25C1.00736 22 0 20.9926 0 19.75V17.25C9.66399e-08 16.0074 1.00736 15 2.25 15H3V13.25C3 12.0074 4.00736 11 5.25 11H18.75ZM13.25 15C14.4926 15 15.5 16.0074 15.5 17.25V19.75C15.5 20.9926 14.4926 22 13.25 22H10.75C9.50736 22 8.5 20.9926 8.5 19.75V17.25C8.5 16.0074 9.50736 15 10.75 15H13.25ZM13.25 2C14.4926 2 15.5 3.00736 15.5 4.25V6.75C15.5 7.99264 14.4926 9 13.25 9H10.75C9.50736 9 8.5 7.99264 8.5 6.75V4.25C8.5 3.00736 9.50736 2 10.75 2H13.25Z"
              fill="#267EF0"
            />
          </svg>
        </span>
        <span class="meta">
          <span class="title">正在查看头像</span>
          <span class="desc">顶栏堆叠在看的人，hover 看 Id，点击复制</span>
        </span>
        <input id="toggle-viewers" type="checkbox" role="switch" checked />
        <span class="track" aria-hidden="true"></span>
      </label>

      <label class="row">
        <span class="glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M18 1.5C19.6569 1.5 21 2.84315 21 4.5V19.5C21 21.1569 19.6569 22.5 18 22.5H6C4.34315 22.5 3 21.1569 3 19.5V4.5C3 2.84315 4.34315 1.5 6 1.5H18ZM14.25 15.5C13.8358 15.5 13.5 15.8358 13.5 16.25C13.5 16.6642 13.8358 17 14.25 17H16.75C17.1642 17 17.5 16.6642 17.5 16.25C17.5 15.8358 17.1642 15.5 16.75 15.5H14.25ZM9.81152 9.19531C9.69111 8.93474 9.30885 8.9347 9.18848 9.19531L9.16699 9.25586L8.69922 10.9932C8.57374 11.4587 8.20875 11.8239 7.74316 11.9492L6.00488 12.417L5.99414 12.4199L5.9834 12.4238C5.68656 12.5257 5.65654 12.9703 5.98828 13.0781L5.99707 13.0811L6.00488 13.083L7.74316 13.5508C8.20897 13.6762 8.57381 14.0404 8.69922 14.5059L9.16699 16.2451L9.16992 16.2539C9.25554 16.5381 9.67547 16.6009 9.80957 16.3086L9.83301 16.2451L10.3018 14.5059C10.4272 14.0405 10.7906 13.6763 11.2559 13.5508L12.9941 13.083H12.9961C13.349 12.9864 13.3184 12.5097 13 12.418L12.9941 12.417L11.2559 11.9492C10.7906 11.8238 10.4272 11.4588 10.3018 10.9932L9.83301 9.25586L9.81152 9.19531ZM15.75 12C15.3358 12 15 12.3358 15 12.75C15 13.1642 15.3358 13.5 15.75 13.5H16.75C17.1642 13.5 17.5 13.1642 17.5 12.75C17.5 12.3358 17.1642 12 16.75 12H15.75ZM14.25 8.5C13.8358 8.50001 13.5 8.8358 13.5 9.25C13.5 9.6642 13.8358 9.99999 14.25 10H16.75C17.1642 9.99998 17.5 9.6642 17.5 9.25C17.5 8.8358 17.1642 8.50002 16.75 8.5H14.25Z"
              fill="#267EF0"
            />
          </svg>
        </span>
        <span class="meta">
          <span class="title">本文关联文档</span>
          <span class="desc">智能文档 / 文档滚到文末，列出文内引用</span>
        </span>
        <input id="toggle-refs" type="checkbox" role="switch" checked />
        <span class="track" aria-hidden="true"></span>
      </label>

      <label class="row">
        <span class="glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v1.5h16V18c0-2.66-5.33-4-8-4z"
              fill="#267EF0"
            />
          </svg>
        </span>
        <span class="meta">
          <span class="title">标题作者与时间</span>
          <span class="desc">智能文档 / 文档标题下显示创建人和编辑时间</span>
        </span>
        <input id="toggle-doc-meta" type="checkbox" role="switch" checked />
        <span class="track" aria-hidden="true"></span>
      </label>

      <label class="row">
        <span class="glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M4 3.5h16c.83 0 1.5.67 1.5 1.5v14c0 .83-.67 1.5-1.5 1.5H4c-.83 0-1.5-.67-1.5-1.5V5c0-.83.67-1.5 1.5-1.5zM4 5v3h16V5H4zm0 4.5V19h16V9.5H4zm2 2h8v1.5H6v-1.5zm0 3.5h8v1.5H6V15z"
              fill="#267EF0"
            />
          </svg>
        </span>
        <span class="meta">
          <span class="title">默认 Web 版式</span>
          <span class="desc">打开文档时自动切到 Web 版式，正文铺满不分页</span>
        </span>
        <input id="toggle-web-layout" type="checkbox" role="switch" checked />
        <span class="track" aria-hidden="true"></span>
      </label>

      <label class="row">
        <span class="glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M11.4 11.4V7h1.2v4.4H17v1.2h-4.4V17h-1.2v-4.4H7v-1.2h4.4zM12 22C6.477 22 2 17.523 2 12S6.477 2 12 2s10 4.477 10 10-4.477 10-10 10zm0-1.2a8.8 8.8 0 100-17.6 8.8 8.8 0 000 17.6z"
              fill="#267EF0"
              fill-rule="evenodd"
            />
          </svg>
        </span>
        <span class="meta">
          <span class="title">快速创建文档</span>
          <span class="desc">文档顶栏加号按钮，一键新建智能文档</span>
        </span>
        <input id="toggle-create" type="checkbox" role="switch" checked />
        <span class="track" aria-hidden="true"></span>
      </label>
    </section>

    <script type="module" src="./popup.js"></script>
  </body>
</html>
